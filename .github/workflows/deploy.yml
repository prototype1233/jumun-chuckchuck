name: Deploy to GitHub Pages

# main 에 푸시하면 자동으로 빌드해서 GitHub Pages 에 올린다.
# 수동으로 돌리고 싶으면 Actions 탭에서 'Run workflow' 를 누르면 된다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 액션이 요구하는 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다. (진행 중인 배포는 취소하지 않는다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 아이콘(public/icons/*)은 저장소에 커밋된 것을 그대로 쓴다.
      # 로고가 한글 워드마크라 여기서 다시 만들면 러너에 한글 폰트가 없어
      # 글자가 깨진 아이콘이 만들어질 수 있다. 로고를 바꿨다면 로컬에서
      # `npm run icons` 를 돌리고 결과를 커밋할 것.

      - name: 빌드 (타입 검사 포함)
        run: npm run build

      # enablement: true — 저장소에 Pages 가 아직 켜져 있지 않아도
      # 워크플로가 직접 켜 준다 (Source 를 'GitHub Actions' 로 설정).
      # 조직 정책 등으로 실패하면 Settings → Pages 에서 수동으로 바꿔야 한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
